<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - WordMean</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='wordmean logo.png') }}">
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }
        body {
            background: radial-gradient(circle at 10% 20%, rgba(220, 252, 231, .55), transparent 40%),
                        radial-gradient(circle at 90% 10%, rgba(243, 232, 255, .55), transparent 40%),
                        #ffffff;
            color: #111827;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .navbar {
            width: 100%;
            max-width: 1200px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 40px;
        }
        .logo-container {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 24px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
        }
        .logo-icon {
            width: 22px;
            height: 22px;
            background: #ccff00;
            border-radius: 50%;
        }
        .form-section {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 40px 20px;
        }
        .form-container {
            width: 100%;
            max-width: 450px;
            background: white;
            border-radius: 25px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, .06);
            border: 1px solid rgba(0, 0, 0, 0.03);
        }
        .form-container h1 {
            text-align: center;
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: -1px;
        }
        .form-container p {
            text-align: center;
            color: #6b7280;
            margin-bottom: 30px;
            font-size: 15px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        .input-group input {
            width: 100%;
            padding: 16px;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
            transition: .3s;
            background: #f9fafb;
        }
        .input-group input:focus {
            border-color: #ccff00;
            background: white;
            box-shadow: 0 0 0 4px rgba(204, 255, 0, .25);
        }
        .btn-submit {
            width: 100%;
            background: #ccff00;
            color: #000;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: .3s;
            margin-top: 10px;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(204, 255, 0, 0.4);
        }
        .form-footer {
            text-align: center;
            margin-top: 25px;
            font-size: 14px;
            color: #6b7280;
        }
        .form-footer a {
            color: #65a30d;
            text-decoration: none;
            font-weight: 600;
        }
        .form-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="/" class="logo-container">
            <div class="logo-icon"></div>
            WordMean
        </a>
    </nav>
    <section class="form-section">
        <div class="form-container">
            <h1>Welcome Back</h1>
            <p>Continue your vocabulary learning journey</p>
            <form action="/login" method="POST">
                <div class="input-group">
                    <input type="text" name="username" placeholder="Username" required>
                </div>
                <div class="input-group">
                    <input type="password" name="password" placeholder="Password" required>
                </div>
                <button type="submit" class="btn-submit">Log In</button>
            </form>
            <div class="form-footer">
                Don't have an account? <a href="/signup">Sign up</a>
            </div>
        </div>
    </section>
</body>
</html>
