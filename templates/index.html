<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WordMean</title>
<link rel="icon" type="image/png" href="{{ url_for('static', filename='wordmean logo.png') }}">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#fff;
    color:#111827;
    overflow-x:hidden;
}

/*==========================
HERO SECTION
===========================*/

.hero-section{

    min-height:100vh;

    display:flex;

    flex-direction:column;

    align-items:center;

    background:

    radial-gradient(circle at 10% 20%,rgba(220,252,231,.55),transparent 40%),

    radial-gradient(circle at 90% 10%,rgba(243,232,255,.55),transparent 40%),

    #ffffff;

}

/*==========================
NAVBAR
===========================*/

.navbar{

    width:100%;

    max-width:1200px;

    display:flex;

    justify-content:space-between;

    align-items:center;

    padding:25px 40px;

}

.logo-container{

    display:flex;

    align-items:center;

    gap:10px;

    font-size:24px;

    font-weight:700;

}

.logo-icon{

    width:22px;

    height:22px;

    background:#ccff00;

    border-radius:50%;

}

.login-btn{

    text-decoration:none;

    color:#333;

    border:1px solid #ddd;

    padding:10px 20px;

    border-radius:10px;

    transition:.3s;

}

.login-btn:hover{

    background:#111827;

    color:white;

}

/*==========================
HERO CONTENT
===========================*/

.hero-content{

    flex:1;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    text-align:center;

    max-width:850px;

    padding:20px;

}

.announcement{

    text-decoration:none;

    color:#444;

    background:white;

    padding:10px 20px;

    border-radius:50px;

    border:1px solid #e5e7eb;

    margin-bottom:35px;

    box-shadow:0 10px 30px rgba(0,0,0,.05);

}

.hero-title{

    font-size:65px;

    line-height:1.1;

    font-weight:700;

    margin-bottom:25px;

    letter-spacing:-2px;

}

.hero-title span{

    color:#65a30d;

}

.hero-subtitle{

    font-size:18px;

    color:#6b7280;

    line-height:1.8;

    max-width:700px;

    margin-bottom:40px;

}

.cta-group{

    display:flex;

    gap:20px;

}

.btn-primary{

    text-decoration:none;

    background:#ccff00;

    color:#000;

    padding:16px 34px;

    border-radius:12px;

    font-weight:600;

    transition:.3s;

}

.btn-primary:hover{

    transform:translateY(-4px);

    box-shadow:0 20px 40px rgba(0,0,0,.15);

}

/*==========================
FORM SECTION
===========================*/

.form-section{

    padding:100px 20px;

    background:#f8fafc;

}

.form-container{

    max-width:900px;

    margin:auto;

    background:white;

    border-radius:25px;

    padding:50px;

    box-shadow:0 20px 60px rgba(0,0,0,.08);

}

.form-container h2{

    text-align:center;

    font-size:40px;

    margin-bottom:15px;

}

.form-container p{

    text-align:center;

    color:#6b7280;

    margin-bottom:35px;

}

.search-box{

    display:flex;

    gap:15px;

}

.search-box input{

    flex:1;

    padding:18px;

    border:1px solid #ddd;

    border-radius:12px;

    font-size:16px;

    outline:none;

    transition:.3s;

}

.search-box input:focus{

    border-color:#ccff00;

    box-shadow:0 0 0 4px rgba(204,255,0,.25);

}

.search-box button{

    background:#ccff00;

    border:none;

    padding:18px 32px;

    border-radius:12px;

    font-weight:600;

    cursor:pointer;

    transition:.3s;

}

.search-box button:hover{

    transform:translateY(-2px);

}

/*==========================
RESULT CARD
===========================*/

.result-card{

    margin-top:40px;

    background:#f9fafb;

    padding:30px;

    border-radius:18px;

}

.result-card h3{

    margin-bottom:12px;

}

/*==========================
SEARCH HISTORY
===========================*/

.history{

    margin-top:45px;

}

.history h3{

    margin-bottom:20px;

}

.history-item{

    background:#fafafa;

    border:1px solid #eee;

    padding:20px;

    border-radius:15px;

    margin-bottom:18px;

    transition:.3s;

}

.history-item:hover{

    transform:translateY(-3px);

    box-shadow:0 15px 30px rgba(0,0,0,.06);

}

/*==========================
RESPONSIVE
===========================*/

@media(max-width:768px){

.hero-title{

font-size:42px;

}

.search-box{

flex-direction:column;

}

.search-box button{

width:100%;

}

.form-container{

padding:30px;

}

}

</style>

</head>

<body>

<section class="hero-section">

<nav class="navbar">

<div class="logo-container">

<div class="logo-icon"></div>

WordMean

</div>

</nav>

<div class="hero-content">

<a class="announcement">

Introducing WordMean for Beginners 

</a>

<h1 class="hero-title">

SEARCH.<br>

LEARN.<br>

<span>REMEMBER.</span>

</h1>

<p class="hero-subtitle">

Learn new words effortlessly. Every word you search is saved automatically, so you can build your vocabulary without worrying about losing your progress.

</p>

<div class="cta-group">
    <a href="/intro" class="btn-primary"></a>
Get Started Now
</a>
<button id="cameraBtn" class="btn-primary">Practise Speaking</button>
</div>

</div><br><br>

<video
    id="video" width="500" autoplay playsinline style="display: none; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,.2);">

    </video>

</section>
<script>
    const cameraBtn = document.getElementById("cameraBtn"); // find the button
    const video = document.getElementById("video");  // find the video box

    cameraBtn.addEventListener("click", async() => {
        const stream = await navigator.mediaDevices.getUserMedia({video: true});
        video.srcObject = stream;
        video.style.display = "block";
    }); // when the button is clicked ask browser can i use the webcam
</script>
</body>
</html>
