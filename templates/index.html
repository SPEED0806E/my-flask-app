<section class="hero-section">

WordMean

<!-- CHANGED: Right-aligned authentication actions added -->

    <a href="/login" class="login-btn">Log In</a>
    <a href="/signup" class="signup-btn">Sign Up</a>
</div>

</nav>

<div class="hero-content">

<a class="announcement">

Introducing WordMean for Beginners 

</a>

<h1 class="hero-title">

SEARCH.<br>

LEARN.<br>

<span>REMEMBER.</span>

</h1>

<p class="hero-subtitle">

Learn new words effortlessly. Every word you search is saved automatically, so you can build your vocabulary without worrying about losing your progress.

</p>

<div class="cta-group">
    <a href="/intro" class="btn-primary">Get started now</a>
<button id="cameraBtn" class="btn-primary">Practise Speaking</button>
</div>

</div><br><br>
<div class="camera-box">
<video
    id="video" width="500" autoplay playsinline style="display: none; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,.2);">
</video>
<div id="lookPoint">
    <span> look here</span><br><br>🔵
</div>
</div>

<p id="faceStatus" style="font-size: 22px; font-weight: bold; margin-top: 20px;">No Face Detected</p>

</section>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/face_detection.js"></script>
<script>
    const cameraBtn = document.getElementById("cameraBtn"); 
    const video = document.getElementById("video");  

    const faceStatus = document.getElementById("faceStatus");
    const faceDetection = new FaceDetection({locateFile: (file) => {
        return `https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/${file}`;
    }
});

faceDetection.setOptions({
        model: 'short',
        minDetectionConfidence: 0.5 // FIXED: Typo corrected
    });

    faceDetection.onResults((results) => {
        if (results.detections && results.detections.length > 0) { // FIXED: Typo and safety check added
            faceStatus.textContent = "Face Detected";
            faceStatus.style.color = "#65a30d";
        } else {
            faceStatus.textContent = "No Face Detected";
            faceStatus.style.color = "#111827";
        }
    });

    cameraBtn.addEventListener("click", async() => {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({video: true});
            video.srcObject = stream;
            const camera = new Camera(video, {onFrame: async () => {
                await faceDetection.send({image:video});
            },
            width: 500,
            height: 375
        });

        camera.start(); 
        
            video.style.display = "block";
            document.getElementById("lookPoint").style.display = "block";
        } catch (err) {
            console.error("Error accessing webcam: ", err);
            faceStatus.textContent = "Webcam Access Denied";
        }
    }); 
</script>
