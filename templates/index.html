HERO SECTION
===========================*/

.hero-section{

    min-height:100vh;

    display:flex;

    flex-direction:column;

    #ffffff;

}

NAVBAR
===========================*/

.navbar{

}

.cta-group{

    display:flex;

}

.btn-primary{

    border-radius:12px;

    font-weight:600;

    transition:.3s;

}

.btn-primary:hover{

}

FORM SECTION
===========================*/

.form-section{

    background:#f8fafc;

}

.form-container{

    max-width:900px;

    margin:auto;

    background:white;

    border-radius:25px;

    padding:50px;

    box-shadow:0 20px 60px rgba(0,0,0,.08);

}

.form-container h2{

    text-align:center;

    font-size:40px;

    margin-bottom:15px;

}

.form-container p{

    text-align:center;

    color:#6b7280;

    margin-bottom:35px;

}

.search-box{

    display:flex;

    gap:15px;

}

.search-box input{

    flex:1;

    padding:18px;

    border:1px solid #ddd;

    border-radius:12px;

    font-size:16px;

    outline:none;

    transition:.3s;

}

.search-box input:focus{

    border-color:#ccff00;

    box-shadow:0 0 0 4px rgba(204,255,0,.25);

}

.search-box button{

    background:#ccff00;

    border:none;

    padding:18px 32px;

    border-radius:12px;

    font-weight:600;

    cursor:pointer;

    transition:.3s;

}

.search-box button:hover{

    transform:translateY(-2px);

}

/*==========================
RESULT CARD
===========================*/

.result-card{

    margin-top:40px;

    background:#f9fafb;

    padding:30px;

    border-radius:18px;

}

.result-card h3{

    margin-bottom:12px;

}

/*==========================
SEARCH HISTORY
===========================*/

.history{

    margin-top:45px;

}

.history h3{

    margin-bottom:20px;

}

.history-item{

    background:#fafafa;

    border:1px solid #eee;

    padding:20px;

    border-radius:15px;

    margin-bottom:18px;

    transition:.3s;

}

.history-item:hover{

    transform:translateY(-3px);

    box-shadow:0 15px 30px rgba(0,0,0,.06);

}

/*==========================
RESPONSIVE
===========================*/

@media(max-width:768px){

.hero-title{

font-size:42px;

}

.search-box{

flex-direction:column;

}

.search-box button{

width:100%;

}

.form-container{

padding:30px;

}

}
